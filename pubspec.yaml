name: kadro_app
description: "Kadro is a Flutter app that identifies anime from a screenshot."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  go_router: ^17.1.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  path_provider: ^2.1.5
  uuid: ^4.5.3
  flutter_core:
    path: local_plugins/flutter_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.31.0


flutter:
  uses-material-design: true