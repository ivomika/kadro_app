name: kadro_app
description: "Kadro is a Flutter app that identifies anime from a screenshot."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.8
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  go_router: ^17.1.0
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3
  flex_color_scheme: ^8.4.0

  # Core
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  uuid: ^4.5.3
  html: ^0.15.6

  # Data
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  validators: ^3.0.0

  flutter_core:
    path: local_plugins/flutter_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  drift_dev: ^2.31.0
  flutter_native_splash: ^2.4.7
  icons_launcher: ^3.0.3
  rename: ^3.1.0


flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png

icons_launcher:
  image_path: "assets/icon/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter_native_splash:
  color: "#42a5f5"
  image: assets/icon/icon.png
  android: true
  ios: true
  fullscreen: true                # default false

  android_12:
    color: "#42a5f5"
    image: assets/icon/icon.png
    icon_background_color: "#111111"
